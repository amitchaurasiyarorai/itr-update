name: Fetch ITR stats

on:
  schedule:
    # Every two hours (GitHub cron is UTC; :23 avoids the busy top of the hour).
    # Scheduled runs are best-effort, so frequent checks mean a skipped run costs
    # nothing; the script only saves when the portal's figures have changed.
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and append
        run: python scripts/fetch_stats.py

      - name: Commit data
        run: |
          git config user.name "itr-update-bot"
          git config user.email "itr-update-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push
          fi
